<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>나의 연애 온도 | 연애 성향 테스트</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
:root{--ink:#372c36;--muted:#847880;--purple:#805b83;--rose:#f1dce6;--cream:#fffaf7;--line:#e9dfe5;--card:#fffefa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 8%,#f7e7ed 0,transparent 33%),radial-gradient(circle at 90% 80%,#e9e2f2 0,transparent 38%),#faf6f4;color:var(--ink);font-family:'Noto Sans KR',sans-serif;min-height:100vh} .shell{max-width:710px;margin:0 auto;padding:24px 20px 76px}.top{display:flex;justify-content:space-between;align-items:center;padding:5px 0 28px;font-size:13px;letter-spacing:1px;font-weight:800}.mark{display:flex;align-items:center;gap:9px}.star{font-size:23px;color:#b07b9b}.tag{font-size:11px;border:1px solid #d9c6d3;border-radius:50px;padding:7px 13px;letter-spacing:0;color:#755a71}.panel{border:1px solid #eadde4;box-shadow:0 24px 65px #8b61701a;border-radius:28px;background:#fffdfbdb;overflow:hidden}.inner{padding:54px 50px 50px}.eyebrow{font-size:12px;color:var(--purple);font-weight:800;letter-spacing:2px}.heroTitle{font-family:'DM Serif Display',serif;font-size:66px;font-weight:400;line-height:1.1;margin:18px 0 4px}.koTitle{font-size:29px;font-weight:800;letter-spacing:-1.5px}.lead{line-height:1.95;color:#776a74;font-size:14px;margin-top:22px}.art{height:190px;display:flex;align-items:center;justify-content:center;position:relative;margin:12px 0 18px}.halo{width:166px;height:166px;border-radius:50%;background:linear-gradient(145deg,#f8dde9,#e9d4e6);display:grid;place-items:center;font-size:80px;box-shadow:0 20px 40px #c18da42a}.orbit{position:absolute;border:1px solid #e3c5d8;border-radius:100%;width:240px;height:145px;transform:rotate(-25deg)}.mini{position:absolute;font-size:25px}.m1{top:17px;right:25%}.m2{bottom:12px;left:27%}.btn{background:#694b6c;color:white;border:0;border-radius:15px;padding:17px 24px;font-size:15px;font-family:inherit;font-weight:800;cursor:pointer;transition:.2s;width:100%}.btn:hover{background:#4f3754;transform:translateY(-2px)}.secondary{background:#f6eef3;color:#694b6c}.secondary:hover{background:#eddfeb}.hint{text-align:center;font-size:12px;color:#a2939e;margin-top:16px}.progressTop{display:flex;justify-content:space-between;color:var(--purple);font-size:12px;font-weight:800;letter-spacing:1px}.track{margin:14px 0 34px;width:100%;height:7px;border-radius:99px;background:#f1e5ed;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#bb8ea9,#785684);border-radius:99px;transition:width .3s}.question{font-size:24px;line-height:1.55;letter-spacing:-1px;margin:0 0 27px;font-weight:800;word-break:keep-all}.options{display:grid;gap:12px}.option{background:#fff;border:1px solid #eadfe6;color:#4e404b;border-radius:16px;padding:19px 20px;display:flex;align-items:center;gap:16px;text-align:left;cursor:pointer;font:inherit;line-height:1.65;transition:.18s}.option:hover{border-color:#b183a4;background:#fbf3f8;transform:translateX(3px)}.letter{width:29px;height:29px;flex:none;border-radius:9px;background:#f7eaf1;color:#a06d8d;display:grid;place-items:center;font-size:13px;font-weight:800}.back{display:inline-flex;border:none;background:none;font:inherit;font-size:13px;color:#91808b;cursor:pointer;padding:28px 0 0}.resultLabel{display:inline-flex;background:#f7e9ef;color:#855c7b;border-radius:50px;padding:9px 17px;font-size:12px;font-weight:800}.resultTitle{font-size:32px;line-height:1.4;letter-spacing:-1px;margin:16px 0}.resultText{font-size:15px;line-height:2;color:#65575f}.traits{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}.trait{border:1px solid #e7d3df;border-radius:50px;padding:9px 13px;font-size:12px;color:#845e7b}.detail{padding:22px;border-radius:19px;background:#faf1f6;margin:22px 0}.detail h3{font-size:15px;margin:0 0 10px}.detail p{font-size:13px;line-height:1.9;margin:0;color:#675a65}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:25px}.fineprint{color:#aa9ba6;text-align:center;font-size:11px;line-height:1.8;margin-top:28px}.hidden{display:none}@media(max-width:530px){.shell{padding:15px 13px 40px}.inner{padding:38px 24px}.heroTitle{font-size:54px}.koTitle{font-size:24px}.question{font-size:21px}.buttons{grid-template-columns:1fr}}
</style></head><body><main class="shell"><header class="top"><div class="mark"><span class="star">✳</span> LOVE, IN MY WAY</div><div class="tag">8 QUESTIONS · 3 MIN</div></header><section class="panel"><div class="inner" id="app"></div></section><footer class="fineprint">나의 연애 온도 · 재미로 알아보는 연애 취향 테스트<br>전문적인 심리검사나 진단이 아니에요.</footer></main><script>
const questions=[
{q:'소개팅 상대의 연락이 전보다 뜸해졌다면?',o:['내가 먼저 연락하며 분위기를 살펴본다','이유를 물어보고 확실하게 소통한다','상대의 속도를 존중하며 기다린다','나한테 관심이 없는 건가 싶어 마음을 정리한다'],t:['spark','secure','calm','real']},
{q:'연애를 시작할 때 가장 끌리는 사람은?',o:['말보다는 행동으로 다정함을 보여주는 사람','처음부터 강하게 설레게 하는 사람','함께 있을 때 편안하고 안정적인 사람','자기 일에 열정적이고 배울 점이 있는 사람'],t:['everyday','spark','secure','real']},
{q:'평소 연인과 데이트한다면 어떤 쪽이 좋아?',o:['미리 계획한 특별한 장소로 떠나는 데이트','같이 밥 먹고 산책하는 소소한 데이트','새로운 취미나 활동을 함께하는 데이트','집에서 각자 쉬면서도 곁에 있는 데이트'],t:['spark','everyday','spark','calm']},
{q:'연인과 의견이 다를 때 나는?',o:['웬만하면 상대방 의견에 맞춰준다','말다툼을 피하고 시간이 지나길 기다린다','서로 원하는 걸 절충해서 결정한다','내가 원하는 것을 솔직히 말하고 다정하게 조율한다'],t:['calm','calm','secure','real']},
{q:'가장 심장이 뛰는 애정 표현은?',o:['사람들 앞에서 거창하게 사랑을 고백할 때','평소 무뚝뚝한 사람이 나에게만 다정할 때','매일 예쁜 말을 자주 해줄 때','예상하지 못한 깜짝 이벤트를 해줄 때'],t:['spark','everyday','secure','spark']},
{q:'오래가는 연애에서 가장 중요한 건?',o:['언제나 새롭고 짜릿한 설렘','서로의 개인적인 시간과 독립성','서로를 꾸준히 우선순위에 두는 마음','조건과 미래 계획이 잘 맞는 것'],t:['spark','calm','secure','real']},
{q:'연인에게 가장 듣고 싶은 말은?',o:['너랑 있으면 매일이 신나','네 선택을 언제나 존중해','나는 너와 함께 미래를 만들고 싶어','너랑 있으면 평범한 하루도 좋아'],t:['spark','calm','real','everyday']},
{q:'내가 사랑받고 있다고 가장 크게 느끼는 순간은?',o:['특별한 날을 위해 정성껏 이벤트를 준비했을 때','별다른 계획 없이 함께 밥 먹고 산책하는 평범한 하루가 너무 즐거울 때','힘든 순간에 묵묵히 나를 지켜줄 때','친구들과 가족 앞에서 나를 자랑스럽게 소개할 때'],t:['spark','everyday','secure','real']}
];
const results={everyday:{name:'일상 공유형 현실적 로맨티스트',emoji:'☕',sub:'사랑은 거창한 이벤트보다, 함께하는 평범한 하루에 있어요.',traits:['일상의 다정함','함께하는 시간','꾸준한 애정','따뜻한 현실감'],strong:'상대에게 먼저 다가갈 줄 알고, 함께할 일상을 풍성하게 만드는 사람. 특별한 이벤트 없이도 둘만의 순간을 행복하게 느끼는 능력이 있어요.',care:'내가 맞춰주는 만큼 상대도 나를 살피고 있는지 확인해요. 편안한 사랑도 나 혼자 만드는 것은 아니니까요.',match:'다정함을 말보다 행동으로 보여주고, 작은 약속을 꾸준히 지키는 사람.'},secure:{name:'든든한 신뢰형 파트너',emoji:'🪴',sub:'설렘도 좋지만, 마음 놓이는 관계가 더 소중해요.',traits:['신뢰','일관성','정서적 안정','깊은 유대'],strong:'관계의 기초를 튼튼하게 쌓고 약속을 소중히 여겨요. 상대와 안정적으로 마음을 나누는 데 강점이 있어요.',care:'모든 게 확실해야만 사랑이 시작되는 건 아니에요. 작은 불확실성에도 여유를 남겨봐요.',match:'약속을 지키고 불편한 대화도 피하지 않는 사람.'},spark:{name:'설렘 탐험형 로맨티스트',emoji:'✨',sub:'두근거림과 새로운 경험이 사랑을 반짝이게 해요.',traits:['설렘','표현력','새로운 경험','낭만'],strong:'관계에 에너지를 불어넣고 특별한 추억을 만들 줄 알아요. 감정을 솔직하게 느끼고 표현하는 매력이 있어요.',care:'강렬한 시작만큼 일상의 안정감도 가치 있어요. 설렘이 잦아들어도 사랑은 깊어질 수 있어요.',match:'모험심이 있으면서도 꾸준히 마음을 표현하는 사람.'},calm:{name:'잔잔한 독립형 동반자',emoji:'🌙',sub:'각자의 세계를 존중하면서도 나란히 걷고 싶어요.',traits:['독립성','배려','여유','자율성'],strong:'관계 안에서도 자신의 일상을 잘 지키고 상대의 속도를 존중해요. 편안한 공간을 만들어줘요.',care:'혼자 해결하려고만 하지 않아도 괜찮아요. 필요한 애정과 관심을 말해도 좋아요.',match:'서로의 공간을 존중하면서 중요한 순간엔 꼭 함께하는 사람.'},real:{name:'미래 설계형 진지한 연인',emoji:'💌',sub:'오늘의 행복과 내일의 방향을 함께 바라봐요.',traits:['미래 지향','진지함','상호 배려','현실 감각'],strong:'말뿐인 약속보다 행동과 계획을 소중하게 여겨요. 오래 함께할 수 있는 삶의 방향을 고민해요.',care:'조건이 완벽히 맞지 않더라도 두 사람이 함께 조율하며 성장할 수 있어요.',match:'가치관을 솔직하게 이야기하고 함께 계획을 세우는 사람.'}};
let step=-1, answers=Array(8).fill(null);const app=document.getElementById('app');
function start(){step=0;render()};function choose(i){answers[step]=i;step++;render()};function back(){step=Math.max(-1,step-1);render()};function reset(){answers=Array(8).fill(null);step=-1;render()};
function outcome(){let scores={everyday:0,secure:0,spark:0,calm:0,real:0};answers.forEach((v,i)=>{if(v!==null)scores[questions[i].t[v]]+=1});let order=['everyday','secure','real','spark','calm'];let k=order.sort((a,b)=>scores[b]-scores[a])[0];return {k,r:results[k]}}
function share(){const {r}=outcome();const s=`나의 연애 성향은 '${r.name}'!\n${r.sub}\n연애 성향 테스트`;if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(()=>{document.getElementById('copy').textContent='복사 완료!'})}else{let el=document.createElement('textarea');el.value=s;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();document.getElementById('copy').textContent='복사 완료!'}}
function render(){if(step===-1){app.innerHTML=`<div class="eyebrow">A LITTLE TEST ABOUT LOVE</div><h1 class="heroTitle">Love, in<br>my way.</h1><div class="koTitle">나의 연애 온도</div><p class="lead">어떤 순간에 사랑을 느끼고, 어떤 사람에게 끌리나요?<br>여덟 가지 선택으로 나의 연애 취향을 찾아보세요.</p><div class="art"><div class="orbit"></div><div class="halo">♡</div><span class="mini m1">✦</span><span class="mini m2">✧</span></div><button class="btn" onclick="start()">테스트 시작하기 →</button><div class="hint">총 8문항 · 약 3분 · 정답은 없어요</div>`;return}
if(step<8){const q=questions[step];app.innerHTML=`<div class="progressTop"><span>YOUR LOVE LANGUAGE</span><span>${String(step+1).padStart(2,'0')} / 08</span></div><div class="track"><div class="fill" style="width:${(step+1)/8*100}%"></div></div><div class="eyebrow">QUESTION ${String(step+1).padStart(2,'0')}</div><h2 class="question">${q.q}</h2><div class="options">${q.o.map((opt,i)=>`<button class="option" onclick="choose(${i})"><span class="letter">${'ABCD'[i]}</span><span>${opt}</span></button>`).join('')}</div><button class="back" onclick="back()">← 이전으로</button>`;return}
const {r}=outcome();app.innerHTML=`<div class="eyebrow">YOUR LOVE STORY</div><div class="art" style="height:160px"><div class="orbit"></div><div class="halo" style="font-size:72px">${r.emoji}</div></div><div class="resultLabel">나의 연애 성향 결과</div><h1 class="resultTitle">${r.name}</h1><p class="resultText">${r.sub}</p><div class="traits">${r.traits.map(v=>`<span class="trait"># ${v}</span>`).join('')}</div><div class="detail"><h3>✦ 나의 연애 강점</h3><p>${r.strong}</p></div><div class="detail"><h3>♡ 기억하면 좋은 점</h3><p>${r.care}</p></div><div class="detail"><h3>☼ 잘 맞는 사람</h3><p>${r.match}</p></div><div class="buttons"><button class="btn secondary" onclick="reset()">다시 테스트</button><button class="btn" id="copy" onclick="share()">결과 복사하기</button></div>`}
render();
</script></body></html>
