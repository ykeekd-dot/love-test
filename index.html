const questions=[
{q:'소개팅 상대의 연락이 전보다 뜸해졌다면?',o:['내가 먼저 연락하며 분위기를 살펴본다','이유를 물어보고 확실하게 소통한다','상대의 속도를 존중하며 기다린다','나한테 관심이 없는 건가 싶어 마음을 정리한다'],t:['spark','secure','calm','real']},
{q:'연애를 시작할 때 가장 끌리는 사람은?',o:['말보다는 행동으로 다정함을 보여주는 사람','처음부터 강하게 설레게 하는 사람','함께 있을 때 편안하고 안정적인 사람','자기 일에 열정적이고 배울 점이 있는 사람'],t:['everyday','spark','secure','real']},
{q:'평소 연인과 데이트한다면 어떤 쪽이 좋아?',o:['미리 계획한 특별한 장소로 떠나는 데이트','같이 밥 먹고 산책하는 소소한 데이트','새로운 취미나 활동을 함께하는 데이트','집에서 각자 쉬면서도 곁에 있는 데이트'],t:['spark','everyday','spark','calm']},
{q:'연인과 의견이 다를 때 나는?',o:['웬만하면 상대방 의견에 맞춰준다','말다툼을 피하고 시간이 지나길 기다린다','서로 원하는 걸 절충해서 결정한다','내가 원하는 것을 솔직히 말하고 다정하게 조율한다'],t:['calm','calm','secure','real']},
{q:'가장 심장이 뛰는 애정 표현은?',o:['사람들 앞에서 거창하게 사랑을 고백할 때','평소 무뚝뚝한 사람이 나에게만 다정할 때','매일 예쁜 말을 자주 해줄 때','예상하지 못한 깜짝 이벤트를 해줄 때'],t:['spark','everyday','secure','spark']},
{q:'오래가는 연애에서 가장 중요한 건?',o:['언제나 새롭고 짜릿한 설렘','서로의 개인적인 시간과 독립성','서로를 꾸준히 우선순위에 두는 마음','조건과 미래 계획이 잘 맞는 것'],t:['spark','calm','secure','real']},
{q:'연인에게 가장 듣고 싶은 말은?',o:['너랑 있으면 매일이 신나','네 선택을 언제나 존중해','나는 너와 함께 미래를 만들고 싶어','너랑 있으면 평범한 하루도 좋아'],t:['spark','calm','real','everyday']},
{q:'내가 사랑받고 있다고 가장 크게 느끼는 순간은?',o:['특별한 날을 위해 정성껏 이벤트를 준비했을 때','별다른 계획 없이 함께 밥 먹고 산책하는 평범한 하루가 너무 즐거울 때','힘든 순간에 묵묵히 나를 지켜줄 때','친구들과 가족 앞에서 나를 자랑스럽게 소개할 때'],t:['spark','everyday','secure','real']},
{q:'연인과 하루를 마무리하는 가장 좋은 방법은?',o:['자기 전 긴 통화로 서로의 하루를 나누기','함께 저녁을 먹고 가볍게 산책하기','각자의 시간을 보내고 다정한 인사 나누기','내일 함께할 일을 짧게 계획하기'],t:['secure','everyday','calm','real']},
{q:'연인이 힘든 하루를 보냈다고 하면?',o:['작은 선물을 준비해 기분을 바꿔준다','좋아하는 음식을 함께 먹으며 곁에 있어 준다','먼저 혼자 쉴 시간을 주고 기다린다','무엇이 필요한지 묻고 함께 해결책을 찾는다'],t:['spark','everyday','calm','real']},
{q:'두 사람의 주말 일정이 갑자기 취소된다면?',o:['즉흥적으로 새로운 데이트를 제안한다','집 근처 카페나 공원에서 편하게 만난다','서로 쉬는 날로 바꾸어도 괜찮다','서로의 다음 일정부터 맞춰본다'],t:['spark','everyday','calm','real']},
{q:'연인이 나에게 해줬으면 하는 배려는?',o:['가끔 예상 못 한 깜짝 선물을 해주기','사소한 취향과 습관을 기억해주기','혼자만의 시간을 자연스럽게 존중하기','중요한 약속을 반드시 지키기'],t:['spark','everyday','calm','secure']},
{q:'친구가 이상형이 어떤 사람이냐고 묻는다면?',o:['함께 있으면 계속 설레는 사람','평범한 시간을 재미있게 만드는 사람','서로를 믿고 마음을 편히 놓을 수 있는 사람','미래에 대한 생각과 생활 방식이 비슷한 사람'],t:['spark','everyday','secure','real']},
{q:'연인과 여행을 간다면 가장 기대되는 것은?',o:['처음 가보는 곳에서 생기는 특별한 추억','맛있는 걸 먹고 같이 돌아다니는 순간','서로의 여행 스타일을 존중하며 여유롭게 쉬기','계획한 여행을 함께 차근차근 완성하기'],t:['spark','everyday','calm','real']},
{q:'연락 때문에 마음이 불편해졌을 때 나는?',o:['애정 표현을 더 해주면 금방 풀릴 것 같다','평소처럼 다정한 대화가 이어지면 좋겠다','연락 빈도보다 서로의 자율성을 더 중요하게 본다','서로 기대하는 연락 방식을 명확히 이야기한다'],t:['spark','everyday','calm','secure']},
{q:'오랜 시간이 지나도 변하지 않았으면 하는 것은?',o:['서로를 바라보며 느끼는 두근거림','같이 웃고 떠들 수 있는 편안한 일상','독립적이면서도 서로 믿는 관계','함께 같은 방향으로 성장하는 마음'],t:['spark','everyday','secure','real']}

const results={everyday:{name:'일상 공유형 현실적 로맨티스트',emoji:'☕',sub:'사랑은 거창한 이벤트보다, 함께하는 평범한 하루에 있어요.',traits:['일상의 다정함','함께하는 시간','꾸준한 애정','따뜻한 현실감'],strong:'함께 보내는 평범한 시간을 특별하게 만드는 힘이 있어요. 상대의 작은 습관과 취향을 기억하고, 맛있는 음식이나 짧은 산책처럼 일상에서 즐거움을 찾아내죠. 거창한 이벤트보다 꾸준한 관심과 행동으로 애정을 표현하며, 함께 있을 때 편안하게 웃을 수 있는 분위기를 만들어요.',care:'함께 있는 시간이 소중한 만큼, 나도 모르게 데이트 계획이나 분위기를 혼자 책임질 수 있어요. 늘 내가 먼저 연락하고 제안하고 있다면 잠깐 멈춰서 상대의 노력도 살펴보세요. 좋아하는 것을 솔직하게 말하고 때로는 상대가 이끄는 시간을 즐기는 것도 균형 잡힌 사랑에 도움이 돼요.',match:'작은 약속을 가볍게 여기지 않고, 바쁜 날에도 마음을 표현하는 사람과 잘 맞아요. 특별한 날보다 평범한 저녁을 함께 즐기고, 서로의 하루를 자연스럽게 나눌 수 있다면 더욱 좋아요. 내가 제안하는 일에 기꺼이 함께하면서도 가끔은 먼저 데이트를 계획해 주는 상대라면 만족도가 높을 거예요.',colors:['#f6d8e5','#ecdaf9']},secure:{name:'든든한 신뢰형 파트너',emoji:'🪴',sub:'설렘도 좋지만, 마음 놓이는 관계가 더 소중해요.',traits:['신뢰','일관성','정서적 안정','깊은 유대'],strong:'연애에서 신뢰와 일관성을 가장 소중하게 여겨요. 감정이 흔들리는 순간에도 서로의 이야기를 듣고 차분하게 관계를 회복하려는 편이에요. 상대가 힘들 때 쉽게 등을 돌리지 않고 곁을 지켜주며, 작은 약속을 지키는 행동으로 오래가는 안정감을 만들어요.',care:'안정감이 중요하다 보니 상대의 연락이나 태도에서 작은 변화만 보여도 의미를 크게 해석할 수 있어요. 하지만 누구에게나 바쁘거나 표현이 서툰 날은 있어요. 불안할 때 혼자 결론을 내리기보다 내가 무엇을 필요로 하는지 구체적으로 이야기하고, 상대의 설명을 들을 여유를 남겨두세요.',match:'말과 행동이 일치하고, 관계에 책임감이 있는 사람과 잘 맞아요. 표현이 화려하지 않더라도 중요한 순간에 연락하고 약속을 지키는 사람이 좋죠. 문제가 생겼을 때 잠수하거나 회피하기보다 불편한 주제도 함께 이야기할 수 있는 상대와 깊은 믿음을 쌓을 수 있어요.',colors:['#d7ead9','#e6f4ef']},spark:{name:'설렘 탐험형 로맨티스트',emoji:'✨',sub:'두근거림과 새로운 경험이 사랑을 반짝이게 해요.',traits:['설렘','표현력','새로운 경험','낭만'],strong:'새로운 장소와 경험을 통해 관계에 활기를 불어넣는 사람입니다. 상대가 좋아할 만한 이벤트를 떠올리거나 평범한 데이트에도 작은 설렘을 더하는 재주가 있어요. 좋아하는 마음을 숨기기보다 표현하려 하고, 함께 웃고 도전하면서 둘만의 생생한 추억을 만드는 데 강해요.',care:'처음의 두근거림이 줄어들 때 사랑도 식었다고 느껴질 수 있어요. 하지만 편안함은 관계가 깊어졌다는 신호일 수도 있죠. 자극적인 이벤트가 없는 날에도 상대의 성실함과 배려를 발견해 보세요. 설렘뿐 아니라 갈등을 풀어가는 방식과 일상의 궁합도 함께 살피면 좋아요.',match:'새로운 것을 함께 시도하고 감정을 솔직하게 표현해 주는 사람과 잘 맞아요. 즉흥적인 데이트를 즐기면서도 약속은 지키는 상대라면 더 좋겠죠. 신나는 순간뿐 아니라 지치고 평범한 날에도 다정함을 잃지 않는 사람이라면 설렘과 안정감을 모두 느낄 수 있어요.',colors:['#ffe0dc','#ffeecf']},calm:{name:'잔잔한 독립형 동반자',emoji:'🌙',sub:'각자의 세계를 존중하면서도 나란히 걷고 싶어요.',traits:['독립성','배려','여유','자율성'],strong:'연애 중에도 자신만의 취향과 시간을 소중히 지킬 줄 알아요. 상대에게 if(step<questions.length){const q=questions[step];app.innerHTML=`<div class="progressTop"><span>YOUR LOVE LANGUAGE</span><span>${String(step+1).padStart(2,'0')} / ${String(questions.length).padStart(2,'0')}</span></div><div class="track"><div class="fill" style="width:${(step+1)/questions.length*100}%"></div></div><div class="eyebrow">QUESTION ${String(step+1).padStart(2,'0')}</div><h2 class="question">${q.q}</h2><div class="options">${q.o.map((opt,i)=>`<button class="option" onclick="choose(${i})"><span class="letter">${'ABCD'[i]}</span><span>${opt}</span></button>`).join('')}</div><button class="back" onclick="back()">← 이전으로</button>`;return}
const {r}=outcome();app.innerHTML=`<div class="eyebrow">YOUR LOVE STORY</div><div class="art" style="height:160px"><div class="orbit"></div><div class="halo" style="font-size:72px">${r.emoji}</div></div><div class="resultLabel">나의 연애 성향 결과</div><h1 class="resultTitle">${r.name}</h1><p class="resultText">${r.sub}</p><div class="traits">${r.traits.map(v=>`<span class="trait"># ${v}</span>`).join('')}</div><div class="detail"><h3>✦ 나의 연애 강점</h3><p>${r.strong}</p></div><div class="detail"><h3>♡ 기억하면 좋은 점</h3><p>${r.care}</p></div><div class="detail"><h3>☼ 잘 맞는 사람</h3><p>${r.match}</p></div><div class="detail" id="liveStats"><p class="hint">참여자 통계 불러오는 중…</p></div><div class="buttons triple"><button class="btn" id="shareButton" onclick="share()">결과+카드 공유하기 ↗</button><button class="btn secondary" onclick="saveCard()">결과 카드 저장</button><button class="btn secondary" id="linkButton" onclick="copyLink()">테스트 링크 복사</button></div><div id="shareStatus" class="statusNote"></div><button class="btn secondary" style="margin-top:10px" onclick="reset()">↺ 다시 테스트하기</button><p class="hint">휴대폰에서는 공유 목록에서 카카오톡을 선택해 줘.<br>일부 PC/브라우저에서는 카드 이미지가 자동 공유되지 않을 수 있어.</p>`;updateLiveStats(outcome().k)}
render();
</script></body></html>
