function outcome(){let scores={everyday:0,secure:0,spark:0,calm:0,real:0};answers.forEach((v,i)=>{if(v!==null)scores[questions[i].t[v]]+=1});let order=['everyday','secure','real','spark','calm'];let k=order.sort((a,b)=>scores[b]-scores[a])[0];return {k,r:results[k]}}
const siteUrl='https://ykeekd-dot.github.io/love-test/';
function shareMessage(){const {r}=outcome();return `나의 연애 유형은 '${r.name}'!\n${r.sub}\n너의 연애 성향도 알아봐 💗\n${siteUrl}`}
async function copyText(value,id){try{await navigator.clipboard.writeText(value)}catch(e){let el=document.createElement('textarea');el.value=value;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove()}const b=document.getElementById(id);if(b)b.textContent='복사 완료!'}
async function share(){const {r}=outcome(); if(navigator.share){try{await navigator.share({title:'나의 연애 온도 | '+r.name,text:`나의 연애 유형은 '${r.name}'!\n${r.sub}\n너도 테스트해봐!`,url:siteUrl});return}catch(e){if(e.name==='AbortError')return}}await copyText(shareMessage(),'shareButton');alert('결과와 링크를 복사했어! 카카오톡 대화창에 붙여넣어 줘.');}
function copyLink(){copyText(siteUrl,'linkButton')}
function render(){if(step===-1){app.innerHTML=`<div class="eyebrow">A LITTLE TEST ABOUT LOVE</div><h1 class="heroTitle">Love, in<br>my way.</h1><div class="koTitle">나의 연애 온도</div><p class="lead">어떤 순간에 사랑을 느끼고, 어떤 사람에게 끌리나요?<br>열여섯 가지 선택으로 나의 연애 취향을 찾아보세요.</p><div class="art"><div class="orbit"></div><div class="halo">♡</div><span class="mini m1">✦</span><span class="mini m2">✧</span></div><button class="btn" onclick="start()">테스트 시작하기 →</button><div class="hint">총 16문항 · 약 5분 · 정답은 없어요</div>`;return}
if(step<questions.length){const q=questions[step];app.innerHTML=`<div class="progressTop"><span>YOUR LOVE LANGUAGE</span><span>${String(step+1).padStart(2,'0')} / ${String(questions.length).padStart(2,'0')}</span></div><div class="track"><div class="fill" style="width:${(step+1)/questions.length*100}%"></div></div><div class="eyebrow">QUESTION ${String(step+1).padStart(2,'0')}</div><h2 class="question">${q.q}</h2><div class="options">${q.o.map((opt,i)=>`<button class="option" onclick="choose(${i})"><span class="letter">${'ABCD'[i]}</span><span>${opt}</span></button>`).join('')}</div><button class="back" onclick="back()">← 이전으로</button>`;return}
const {r}=outcome();app.innerHTML=`<div class="eyebrow">YOUR LOVE STORY</div><div class="art" style="height:160px"><div class="orbit"></div><div class="halo" style="font-size:72px">${r.emoji}</div></div><div class="resultLabel">나의 연애 성향 결과</div><h1 class="resultTitle">${r.name}</h1><p class="resultText">${r.sub}</p><div class="traits">${r.traits.map(v=>`<span class="trait"># ${v}</span>`).join('')}</div><div class="detail"><h3>✦ 나의 연애 강점</h3><p>${r.strong}</p></div><div class="detail"><h3>♡ 기억하면 좋은 점</h3><p>${r.care}</p></div><div class="detail"><h3>☼ 잘 맞는 사람</h3><p>${r.match}</p></div><div class="detail" id="liveStats"><p class="hint">참여자 통계 불러오는 중…</p></div><div class="buttons"><button class="btn" id="shareButton" onclick="share()">카톡·친구에게 공유하기 ↗</button><button class="btn secondary" id="linkButton" onclick="copyLink()">테스트 링크 복사</button></div><button class="back" onclick="reset()">↺ 다시 테스트하기</button><p class="hint">휴대폰에서는 공유 목록에서 카카오톡을 선택해 줘.<br>PC에서는 링크 복사 후 카톡에 붙여넣으면 돼.</p>`;updateLiveStats(outcome().k)}
render();
</script></body></html>
